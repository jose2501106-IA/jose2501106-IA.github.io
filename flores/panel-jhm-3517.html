<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panel de visitas</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eae1f3">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --fondo: #eae1f3;
    --texto: #6f5a7d;
    --texto-suave: #9d88ab;
    --acento: #f0c4d8;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--fondo);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 28px;
  }
  .contenido { text-align: center; width: 100%; max-width: 360px; }
  .titulo {
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--texto-suave);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
  }
  .numero {
    font-size: 110px;
    font-weight: 400;
    color: var(--texto);
    margin-top: 18px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: transform 0.25s ease;
  }
  .numero.salto { transform: scale(1.12); }
  .etiqueta {
    font-size: 16px;
    font-style: italic;
    color: var(--texto-suave);
    margin-top: 14px;
  }
  .linea {
    width: 50px;
    height: 2px;
    margin: 36px auto;
    background: var(--acento);
    border-radius: 2px;
  }
  .estado {
    font-size: 13px;
    color: var(--texto-suave);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .punto {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #a8d5a2;
    margin-right: 6px;
    animation: pulso 2s ease-in-out infinite;
  }
  @keyframes pulso {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
</style>
</head>
<body>
  <div class="contenido">
    <p class="titulo">Tarjeta de Natalia</p>
    <div class="numero" id="contador">–</div>
    <p class="etiqueta">veces abierta</p>
    <div class="linea"></div>
    <p class="estado"><span class="punto"></span>Actualización en vivo · <span id="hora">—</span></p>
  </div>
  <script>
    var anterior = null;
    function actualizar() {
      fetch('https://abacus.jasoncameron.dev/get/jhm-flores-2026/visitas')
        .then(function(r) {
          if (!r.ok) throw new Error('sin datos');
          return r.json();
        })
        .then(function(d) {
          var el = document.getElementById('contador');
          var valor = d.value;
          if (anterior !== null && valor !== anterior) {
            el.classList.add('salto');
            setTimeout(function(){ el.classList.remove('salto'); }, 300);
          }
          anterior = valor;
          el.textContent = valor;
          document.getElementById('hora').textContent =
            new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        })
        .catch(function() {
          if (anterior === null) {
            document.getElementById('contador').textContent = '0';
            document.getElementById('hora').textContent =
              new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          }
        });
    }
    actualizar();
    setInterval(actualizar, 5000);
  </script>
</body>
</html>
