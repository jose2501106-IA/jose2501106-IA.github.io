<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para Natalia</title>
<meta name="theme-color" content="#eae1f3">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --fondo: #eae1f3;
    --texto: #6f5a7d;
    --texto-suave: #9d88ab;
    --acento: #f0c4d8;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--fondo);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom));
  }
  .contenido {
    text-align: center;
    animation: aparecer 1.4s ease-out both;
    width: 100%;
    max-width: 360px;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .para {
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--texto-suave);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
  }
  h1 {
    font-size: 40px;
    font-weight: 400;
    font-style: italic;
    color: var(--texto);
    margin-top: 14px;
  }
  .linea {
    width: 50px;
    height: 2px;
    margin: 44px auto;
    background: var(--acento);
    border-radius: 2px;
  }
  .mensaje {
    font-size: 19px;
    line-height: 1.6;
    color: var(--texto);
    font-style: italic;
  }
  .firma {
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--texto-suave);
    margin-top: 52px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
</style>
</head>
<body>
  <div class="contenido">
    <p class="para">Para</p>
    <h1>Natalia Valeriano</h1>
    <div class="linea"></div>
    <p class="mensaje">Estas flores son para ti.</p>
    <p class="firma">JOSÉ HUGO MEZA</p>
  </div>
  <script>
    fetch('https://abacus.jasoncameron.dev/hit/jhm-flores-2026/visitas').catch(function(){});
  </script>
</body>
</html>
