    nombre: "Cuentas Claras"
    categorias: [producto]
    estado: {es: "2 PREMIOS", en: "2 AWARDS"}
    subtitulo: {es: "Bitácora de fiado cofirmada · Goya Hack 2026", en: "Credit ledger signed by both parties · Goya Hack 2026"}
    distinciones:
      texto: {es: "Goya Hack 2026 · CriptoUNAM × Facultad de Ingeniería, UNAM", en: "Goya Hack 2026 · CriptoUNAM × UNAM School of Engineering"}
      premios:
        - {medalla: "medalla-2", titulo: {es: "2.º LUGAR · TRACK POLLAR", en: "2ND PLACE · POLLAR TRACK"}}
        - {medalla: "medalla-3", titulo: {es: "3.er LUGAR · TRACK CONTENIDO", en: "3RD PLACE · CONTENT TRACK"}}
