      - {valor: "10k+", texto: {es: "votos individuales", en: "individual votes"}}
      - {valor: "7", texto: {es: "partidos cubiertos", en: "parties covered"}}
    tecnologias: ["Claude API", "SQLite", "Pandas", "BeautifulSoup", "Streamlit"]
    enlaces:
      - {texto: {es: "Ver repositorio", en: "View repository (in Spanish)"}, url: "https://github.com/jose2501106-IA/agente-legislativo-mx"}

  - codigo: "P-02"
    nombre: "Neurona Artificial"
    categorias: [ia, producto]
    estado: {es: "EN CONSTRUCCIÓN", en: "WORK IN PROGRESS"}
    subtitulo: {es: "Curso abierto para entender la IA por dentro", en: "An open course on how AI works under the hood"}
    descripcion:
      es: "Videos interactivos con laboratorio para entender cómo funciona la inteligencia artificial, de una sola neurona a los agentes que deciden y actúan. Cada lección trae capítulos, subtítulos y un laboratorio para mover cada pieza."
      en: "Interactive videos with a hands-on lab to understand how artificial intelligence works, from a single neuron to agents that decide and act. Each lesson has chapters, captions and a lab where you can adjust every part."
    demuestra: {es: "Fundamentos de IA · explicar lo técnico con claridad · diseño de producto", en: "AI fundamentals · explaining technical ideas clearly · product design"}
    cifras:
      - {valor: "2", texto: {es: "lecciones publicadas", en: "lessons published"}}
      - {valor: "7", texto: {es: "lecciones en camino", en: "lessons on the way"}}
    tecnologias: ["HTML", "CSS", "JavaScript", {es: "Sistema de diseño propio", en: "Custom design system"}]
    enlaces:
      - {texto: {es: "Ver curso", en: "View course (in Spanish)"}, url: "https://jose2501106-ia.github.io/NeuronaArtificial/"}
      - {texto: {es: "Ver repositorio", en: "View repository"}, url: "https://github.com/jose2501106-IA/NeuronaArtificial"}

  - codigo: "P-03"
    nombre: {es: "Pipeline de auditoría", en: "Audit pipeline"}
    categorias: [auto, datos]
    estado: {es: "EN PRODUCCIÓN", en: "IN PRODUCTION"}
    subtitulo: {es: "Negocio mayorista · Central de Abasto, CDMX", en: "Wholesale business · Central de Abasto, Mexico City"}
    descripcion:
      es: "Automatiza la auditoría diaria de la operación del almacén con Python y Apps Script. Va en su versión 7 y corre en producción todos los días."
      en: "Automates the warehouse's daily operations audit with Python and Apps Script. Now on version 7, running in production every day."
    demuestra: {es: "Software en producción · iteración continua hasta la v7", en: "Production software · iterated through 7 versions"}
    cifras:
      - {valor: "v7", texto: {es: "versión en producción", en: "production version"}}
    tecnologias: ["Python", "Apps Script", "Google Sheets"]
    enlaces: []          # repo privado: se muestra la etiqueta ui.privado

  - codigo: "P-04"
    nombre: "Cuentas Claras"
    categorias: [producto]
    estado: {es: "3.er LUGAR", en: "3RD PLACE"}
    subtitulo: {es: "Bitácora de fiado cofirmada · Goya Hack 2026", en: "Credit ledger signed by both parties · Goya Hack 2026"}
    distincion:
      titulo: {es: "3.er LUGAR · TRACK CONTENIDO", en: "3RD PLACE · CONTENT TRACK"}
      texto: {es: "Goya Hack 2026 · Facultad de Ingeniería, UNAM", en: "Goya Hack 2026 · UNAM School of Engineering"}
    descripcion:
      es: "La bodega registra cada venta a crédito y el cliente la confirma desde su teléfono: nadie anota una deuda solo ni borra el historial. Las reglas las hace cumplir un contrato en Stellar."
      en: "The wholesaler records each credit sale and the customer confirms it from their phone, so neither side can log a debt alone or erase the history. A Stellar smart contract enforces the rules."
    demuestra: {es: "Contratos inteligentes · diseño de producto · pitch de 3 minutos", en: "Smart contracts · product design · 3-minute pitch"}
    cifras:
      - {valor: "3", texto: {es: "reglas en el contrato", en: "on-chain rules"}}
      - {valor: "2", texto: {es: "firmas por nota", en: "signatures per entry"}}
    tecnologias: ["Stellar", "Soroban · Rust", "JavaScript", "Node.js"]
    enlaces:
      - {texto: {es: "Ver repositorio", en: "View repository (in Spanish)"}, url: "https://github.com/jose2501106-IA/goyahack_cuentas-claras"}

