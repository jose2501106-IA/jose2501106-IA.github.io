    nombre: {es: "Pipeline de auditoría", en: "Audit pipeline"}
    categorias: [auto, datos]
    estado: {es: "EN PRODUCCIÓN", en: "IN PRODUCTION"}
    subtitulo: {es: "Empresa de distribución · CDMX", en: "Distribution company · Mexico City"}
    descripcion:
      es: "Automatiza la auditoría diaria de la operación del almacén con Python y Apps Script. Va en su versión 7 y corre en producción todos los días."
      en: "Automates the warehouse's daily operations audit with Python and Apps Script. Now on version 7, running in production every day."
    demuestra: {es: "Software en producción · iteración continua hasta la v7", en: "Production software · iterated through 7 versions"}
    cifras:
