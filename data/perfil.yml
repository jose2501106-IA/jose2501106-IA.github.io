      es: "La bodega registra cada venta a crédito y el cliente la confirma desde su teléfono: nadie anota una deuda solo ni borra el historial. Las reglas las hace cumplir un contrato en Stellar."
      en: "The wholesaler records each credit sale and the customer confirms it from their phone, so neither side can log a debt alone or erase the history. A Stellar smart contract enforces the rules."
    demuestra: {es: "Contratos inteligentes · diseño de producto · pitch de 3 minutos", en: "Smart contracts · product design · 3-minute pitch"}
    cifras:
