proyectos:
  - codigo: "P-01"
    nombre: "AgenteMX"
    categorias: [ia, datos]
    estado: {es: "FUNCIONAL", en: "FUNCTIONAL"}
    subtitulo: {es: "Agente de IA para transparencia legislativa", en: "AI agent for legislative transparency"}
    descripcion:
      es: "Responde en lenguaje natural preguntas sobre cómo votan los diputados, con datos oficiales y citas a la fuente. Incluye un índice de disciplina partidista y, como prototipos, análisis de consistencia entre iniciativas y votos, y de comportamiento en periodo electoral."
      en: "Answers plain-language questions about how members of Mexico's Chamber of Deputies vote, with official data and source citations. It includes a party-discipline index and, as prototypes, analyses of consistency between bills and votes and of voting behavior during election periods."
    # Datos y fuentes: el alcance que hoy sostienen el README y el código del repositorio (LXV Legislatura)
    fuentes:
      es: "Votaciones nominales de la LXV Legislatura (SITL, Cámara de Diputados). La carga de iniciativas de la Gaceta Parlamentaria está en prototipo."
      en: "Roll-call votes from the 65th Legislature (SITL, Chamber of Deputies). Loading bills from the Gaceta Parlamentaria is at the prototype stage."
    cv_fuentes:           # versión corta para el CV (cabe en un renglón)
      es: "Votaciones nominales de la LXV Legislatura (SITL); iniciativas de la Gaceta Parlamentaria, en prototipo."
      en: "Roll-call votes from the 65th Legislature (SITL); bills from the Gaceta Parlamentaria, in prototype."
    demuestra: {es: "Agentes con herramientas · ETL de datos públicos · interfaz en Streamlit", en: "Tool-using agents · public-data ETL · Streamlit UI"}
    # Imagen de la tarjeta: «imagen» (captura real) o «esquema» (diagrama hecho con texto de esta ficha).
    # Aquí, esquema: los pasos salen de la arquitectura que documenta el README del repositorio.
    esquema:
      pie: {es: "ESQUEMA · CÓMO RESPONDE EL AGENTE", en: "DIAGRAM · HOW THE AGENT ANSWERS"}
      pasos:
        - {titulo: {es: "Pregunta", en: "Question"}, texto: {es: "en lenguaje natural", en: "in plain language"}}
        - {titulo: {es: "Claude decide", en: "Claude decides"}, texto: {es: "qué herramienta usar", en: "which tool to use"}}
        - {titulo: {es: "8 herramientas", en: "8 tools"}, texto: {es: "consultan la base SQLite", en: "query the SQLite database"}}
        - {titulo: {es: "Respuesta", en: "Answer"}, texto: {es: "con citas a fuentes oficiales", en: "with official source citations"}}
    cifras:
      - {valor: "8", texto: {es: "herramientas del agente", en: "agent tools"}}
      - {valor: "10k+", texto: {es: "votos individuales", en: "individual votes"}}
      - {valor: "7", texto: {es: "partidos cubiertos", en: "parties covered"}}
    tecnologias: ["Claude API", "SQLite", "Pandas", "BeautifulSoup", "Streamlit"]
    enlaces:
      - {texto: {es: "Ver repositorio", en: "View repository (in Spanish)"}, url: "https://github.com/jose2501106-IA/agente-legislativo-mx"}

  - codigo: "P-02"
    nombre: "Neurona Artificial"
    categorias: [ia, producto]
    estado: {es: "EN CONSTRUCCIÓN", en: "WORK IN PROGRESS"}
    subtitulo: {es: "Curso abierto para entender la IA por dentro", en: "An open course on how AI works under the hood"}
    descripcion:
      es: "Videos interactivos con laboratorio para entender cómo funciona la inteligencia artificial, de una sola neurona a los agentes que deciden y actúan. Cada lección trae capítulos, subtítulos y un laboratorio para mover cada pieza."
      en: "Interactive videos with a hands-on lab to understand how artificial intelligence works, from a single neuron to agents that decide and act. Each lesson has chapters, captions and a lab where you can adjust every part."
