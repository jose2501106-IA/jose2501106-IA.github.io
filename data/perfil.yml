    descripcion:
      es: "Responde en lenguaje natural cómo votan los diputados, con datos oficiales y citas a la fuente. Incluye índice de disciplina partidista, detector de contradicciones y radar electoral."
      en: "Answers plain-language questions about how members of Mexico's Chamber of Deputies vote, with official data and source citations. Includes a party-discipline index, a contradiction detector and an election radar."
    demuestra: {es: "Agentes con herramientas · ETL de datos públicos · interfaz en Streamlit", en: "Tool-using agents · public-data ETL · Streamlit UI"}
    cifras:
